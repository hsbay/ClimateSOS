[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climatesos"
version = "0.8.0"
description = "Climate State-Transition Operating System (ClimateSOS)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/climatesos/__init__.py" = ["E501", "I001", "RUF022"]
"src/climatesos/evaluator.py" = ["E501"]
"src/climatesos/states.py" = ["UP042"]
"tests/test_datacenter_v07.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "climatesos.states"
disable_error_code = ["no-any-return"]
