<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">ClimateSOS Layered Architecture Diagram</title>
  <desc id="desc">Layered conceptual architecture for ClimateSOS. Icons appear only in the ClimateSOS Kernel layer.</desc>
  <defs>
    <style>
      .title { font: 700 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .layerTag { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; fill: #374151; }
      .section { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .micro { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .box { stroke: #1f2937; stroke-width: 2.5; rx: 18; }
      .inner { fill: #ffffff; stroke: #4b5563; stroke-width: 2; rx: 14; }
      .line { stroke: #6b7280; stroke-width: 3; }
      .iconLine { fill: none; stroke: #5b4fd6; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .iconFill { fill: #5b4fd6; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fbfaf8"/>

  <text x="800" y="70" text-anchor="middle" class="title">ClimateSOS Layered Architecture Diagram</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Conceptual distributed transition operating system architecture.</text>

  <rect x="110" y="160" width="1380" height="128" class="box" fill="#e7f0ff"/>
  <text x="145" y="195" class="layerTag">LAYER 1</text>
  <text x="800" y="218" text-anchor="middle" class="section">External System Inputs</text>
  <text x="800" y="254" text-anchor="middle" class="small">Climate • Energy • Biosphere • Finance • Governance • Infrastructure</text>

  <rect x="170" y="350" width="1260" height="146" class="box" fill="#f0ecff"/>
  <text x="205" y="386" class="layerTag">LAYER 2</text>
  <text x="800" y="410" text-anchor="middle" class="section">Identity / Synchronization Layer</text>
  <text x="800" y="450" text-anchor="middle" class="small">Identity Tokens • TTL • Synchronization State • Delivery Alignment</text>

  <rect x="110" y="570" width="1380" height="250" class="box" fill="#ebe8ff"/>
  <text x="145" y="607" class="layerTag">LAYER 3</text>
  <text x="800" y="630" text-anchor="middle" class="section">ClimateSOS Kernel</text>
  <text x="800" y="662" text-anchor="middle" class="small">Runtime coordination layer. Observes and arbitrates; it does not command real-world execution.</text>

  <rect x="210" y="705" width="340" height="76" class="inner"/>
  <g transform="translate(270 743)" aria-label="Synchronization scheduler icon">
    <circle cx="0" cy="0" r="25" class="iconLine"/>
    <path d="M0 -15 v16 l13 9" class="iconLine"/>
    <path d="M17 -20 h14 v14" class="iconLine"/>
  </g>
  <text x="330" y="734" class="label">Synchronization</text>
  <text x="330" y="759" class="label">Scheduler</text>

  <rect x="630" y="705" width="340" height="76" class="inner"/>
  <g transform="translate(690 743)" aria-label="Pressure accumulation icon">
    <path d="M-28 20 A28 28 0 0 1 28 20" class="iconLine"/>
    <path d="M0 20 L18 -8" class="iconLine"/>
    <circle cx="0" cy="20" r="4.5" class="iconFill"/>
    <path d="M-20 10 l-8 -3" class="iconLine"/>
    <path d="M-8 -7 l-4 -8" class="iconLine"/>
    <path d="M8 -7 l4 -8" class="iconLine"/>
    <path d="M20 10 l8 -3" class="iconLine"/>
  </g>
  <text x="750" y="734" class="label">Pressure</text>
  <text x="750" y="759" class="label">Accumulation</text>

  <rect x="1050" y="705" width="340" height="76" class="inner"/>
  <g transform="translate(1110 743)" aria-label="Weighted attractors icon">
    <circle cx="0" cy="0" r="16" class="iconLine"/>
    <circle cx="0" cy="0" r="4" class="iconFill"/>
    <circle cx="0" cy="-25" r="5" class="iconFill"/>
    <circle cx="25" cy="0" r="5" class="iconFill"/>
    <circle cx="0" cy="25" r="5" class="iconFill"/>
    <circle cx="-25" cy="0" r="5" class="iconFill"/>
    <path d="M0 -16 v-9" class="iconLine"/>
    <path d="M16 0 h9" class="iconLine"/>
    <path d="M0 16 v9" class="iconLine"/>
    <path d="M-16 0 h-9" class="iconLine"/>
  </g>
  <text x="1170" y="734" class="label">Weighted</text>
  <text x="1170" y="759" class="label">Attractors</text>

  <rect x="110" y="895" width="1380" height="128" class="box" fill="#e9f7ef"/>
  <text x="145" y="930" class="layerTag">LAYER 4</text>
  <text x="800" y="954" text-anchor="middle" class="section">System Outcomes</text>
  <text x="800" y="992" text-anchor="middle" class="small">CleanBound • MixedBound • FossilBound • NoAck • BioBound</text>

  <line x1="800" y1="288" x2="800" y2="350" class="line"/>
  <line x1="800" y1="496" x2="800" y2="570" class="line"/>
  <line x1="800" y1="820" x2="800" y2="895" class="line"/>

  <text x="800" y="1092" text-anchor="middle" class="micro">
    Conceptual systems architecture diagram • Illustrative ontology / prototype model • Not a calibrated operational deployment model.
  </text>
</svg>