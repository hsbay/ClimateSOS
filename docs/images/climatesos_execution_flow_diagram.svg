<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title desc">
  <title id="title">ClimateSOS Execution / Flow Architecture Diagram</title>
  <desc id="desc">Dynamic execution view showing synchronization flow, pressure accumulation, and outcome binding with additional internal padding.</desc>
  <defs>
    <style>
      .title { font: bold 44px sans-serif; fill: #111; }
      .subtitle { font: 24px sans-serif; fill: #444; }
      .section { font: bold 30px sans-serif; fill: #111; }
      .label { font: 22px sans-serif; fill: #111; }
      .small { font: 18px sans-serif; fill: #444; }
      .box { fill: #f5f5f5; stroke: #222; stroke-width: 3; rx: 18; }
      .inner { fill: #ffffff; stroke: #444; stroke-width: 2; rx: 12; }
      .line { stroke: #444; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="800" y="70" text-anchor="middle" class="title">ClimateSOS Execution / Flow Architecture Diagram</text>
  <text x="800" y="112" text-anchor="middle" class="subtitle">Dynamic execution view showing synchronization flow, pressure accumulation, and outcome binding.</text>

  <rect x="80" y="180" width="1440" height="150" class="box"/>
  <text x="800" y="235" text-anchor="middle" class="section">External System Drivers</text>

  <rect x="120" y="260" width="240" height="54" class="inner"/>
  <text x="240" y="294" text-anchor="middle" class="label">Capital / Finance</text>

  <rect x="425" y="260" width="250" height="54" class="inner"/>
  <text x="550" y="294" text-anchor="middle" class="label">Policy + Governance</text>

  <rect x="740" y="260" width="250" height="54" class="inner"/>
  <text x="865" y="294" text-anchor="middle" class="label">Biosphere Conditions</text>

  <rect x="1060" y="260" width="300" height="54" class="inner"/>
  <text x="1210" y="294" text-anchor="middle" class="label">Fossil System State</text>

  <line x1="800" y1="330" x2="800" y2="415" class="line"/>

  <rect x="440" y="415" width="720" height="145" class="box"/>
  <text x="800" y="475" text-anchor="middle" class="section">Identity Tokens</text>
  <text x="800" y="518" text-anchor="middle" class="small">TTL • Binding • History • Synchronization State</text>

  <line x1="800" y1="560" x2="800" y2="635" class="line"/>

  <rect x="80" y="635" width="1440" height="150" class="box"/>
