  <rect x="1030" y="1210" width="350" height="68" class="inner"/>
  <text x="1205" y="1252" text-anchor="middle" class="label">Weighted Attractors</text>

  <rect x="490" y="1308" width="620" height="68" class="inner"/>
  <text x="800" y="1350" text-anchor="middle" class="label">Delivery / Alignment Switch</text>

  <line x1="800" y1="1365" x2="800" y2="1440" class="line"/>

  <rect x="80" y="1440" width="1440" height="150" class="box"/>
  <text x="800" y="1495" text-anchor="middle" class="section">System Outcomes</text>

  <rect x="170" y="1520" width="240" height="54" class="inner"/>
  <text x="290" y="1554" text-anchor="middle" class="label">CleanBound</text>

  <rect x="490" y="1520" width="240" height="54" class="inner"/>
  <text x="610" y="1554" text-anchor="middle" class="label">MixedBound</text>

  <rect x="810" y="1520" width="240" height="54" class="inner"/>
  <text x="930" y="1554" text-anchor="middle" class="label">FossilBound</text>

  <rect x="1130" y="1520" width="260" height="54" class="inner"/>
