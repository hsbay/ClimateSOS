<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580">
  <defs>
    <style>
      .title { font: bold 44px sans-serif; fill: #111; }
      .subtitle { font: 24px sans-serif; fill: #444; }
      .section { font: bold 30px sans-serif; fill: #111; }
      .label { font: 22px sans-serif; fill: #111; }
      .small { font: 18px sans-serif; fill: #444; }
      .box { fill: #f5f5f5; stroke: #222; stroke-width: 3; rx: 18; }
      .inner { fill: #ffffff; stroke: #444; stroke-width: 2; rx: 12; }
      .line { stroke: #444; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="800" y="70" text-anchor="middle" class="title">ClimateSOS Execution / Flow Architecture Diagram</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Dynamic execution view showing synchronization flow, pressure accumulation, and outcome binding.</text>

  <rect x="80" y="180" width="1440" height="120" class="box"/>
  <text x="800" y="230" text-anchor="middle" class="section">External System Drivers</text>

  <rect x="120" y="255" width="220" height="50" class="inner"/>
  <text x="230" y="288" text-anchor="middle" class="label">Capital / Finance</text>

  <rect x="430" y="255" width="220" height="50" class="inner"/>
  <text x="540" y="288" text-anchor="middle" class="label">Policy + Governance</text>

  <rect x="740" y="255" width="220" height="50" class="inner"/>
  <text x="850" y="288" text-anchor="middle" class="label">Biosphere Conditions</text>

  <rect x="1050" y="255" width="300" height="50" class="inner"/>
  <text x="1200" y="288" text-anchor="middle" class="label">Fossil System State</text>

  <rect x="460" y="400" width="680" height="120" class="box"/>
  <text x="800" y="455" text-anchor="middle" class="section">Identity Tokens</text>
  <text x="800" y="495" text-anchor="middle" class="small">TTL • Binding • History • Synchronization State</text>

  <line x1="800" y1="300" x2="800" y2="400" class="line"/>

  <rect x="80" y="600" width="1440" height="120" class="box"/>
  <text x="800" y="650" text-anchor="middle" class="section">Synchronization Fabrics</text>

  <rect x="120" y="675" width="260" height="50" class="inner"/>
  <text x="250" y="708" text-anchor="middle" class="label">Deliverability Fabric</text>

  <rect x="470" y="675" width="260" height="50" class="inner"/>
  <text x="600" y="708" text-anchor="middle" class="label">Procurement Fabric</text>

  <rect x="820" y="675" width="260" height="50" class="inner"/>
  <text x="950" y="708" text-anchor="middle" class="label">Institutional Fabric</text>

  <rect x="1170" y="675" width="260" height="50" class="inner"/>
  <text x="1300" y="708" text-anchor="middle" class="label">Fossil Constraint Fabric</text>

  <line x1="800" y1="520" x2="800" y2="600" class="line"/>

  <rect x="80" y="820" width="1440" height="120" class="box"/>
  <text x="800" y="870" text-anchor="middle" class="section">Queues / Pressure Accumulation</text>

  <rect x="120" y="895" width="220" height="50" class="inner"/>
  <text x="230" y="928" text-anchor="middle" class="label">Delivery Queue</text>

  <rect x="430" y="895" width="220" height="50" class="inner"/>
  <text x="540" y="928" text-anchor="middle" class="label">Adequacy Queue</text>

  <rect x="740" y="895" width="220" height="50" class="inner"/>
  <text x="850" y="928" text-anchor="middle" class="label">Materials Queue</text>

  <rect x="1050" y="895" width="220" height="50" class="inner"/>
  <text x="1160" y="928" text-anchor="middle" class="label">Permitting Queue</text>

  <line x1="800" y1="720" x2="800" y2="820" class="line"/>

  <rect x="120" y="1010" width="1360" height="240" class="box"/>
  <text x="800" y="1080" text-anchor="middle" class="section">ClimateSOS Kernel</text>

  <rect x="240" y="1140" width="320" height="60" class="inner"/>
  <text x="400" y="1178" text-anchor="middle" class="label">Synchronization Scheduler</text>

  <rect x="640" y="1140" width="320" height="60" class="inner"/>
  <text x="800" y="1178" text-anchor="middle" class="label">Pressure Accumulation</text>

  <rect x="1040" y="1140" width="320" height="60" class="inner"/>
  <text x="1200" y="1178" text-anchor="middle" class="label">Weighted Attractors</text>

  <rect x="520" y="1260" width="560" height="60" class="inner"/>
  <text x="800" y="1298" text-anchor="middle" class="label">Delivery / Alignment Switch</text>

  <line x1="800" y1="940" x2="800" y2="1010" class="line"/>

  <rect x="80" y="1380" width="1440" height="120" class="box"/>
  <text x="800" y="1430" text-anchor="middle" class="section">System Outcomes</text>

  <rect x="180" y="1450" width="220" height="50" class="inner"/>
  <text x="290" y="1483" text-anchor="middle" class="label">CleanBound</text>

  <rect x="500" y="1450" width="220" height="50" class="inner"/>
  <text x="610" y="1483" text-anchor="middle" class="label">MixedBound</text>

  <rect x="820" y="1450" width="220" height="50" class="inner"/>
  <text x="930" y="1483" text-anchor="middle" class="label">FossilBound</text>

  <rect x="1140" y="1450" width="220" height="50" class="inner"/>
  <text x="1250" y="1483" text-anchor="middle" class="label">NoAck / Timeout</text>

  <text x="800" y="1540" text-anchor="middle" class="small">
    Conceptual systems architecture diagram • Illustrative ontology / prototype model • Not a calibrated operational deployment model.
  </text>
</svg>