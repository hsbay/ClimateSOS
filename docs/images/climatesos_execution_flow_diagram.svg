<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">ClimateSOS Execution / Flow Architecture Diagram</title>
  <desc id="desc">Dynamic execution view showing synchronization flow, pressure accumulation, and outcome binding across external drivers, identity tokens, synchronization fabrics, queues, kernel logic, and system outcomes.</desc>

  <defs>
    <style>
      :root {
        color-scheme: light;
      }
      .title { font: 700 48px Inter, Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: italic 25px Inter, Arial, Helvetica, sans-serif; fill: #374151; }
      .layer-title { font: 700 31px Inter, Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 600 22px Inter, Arial, Helvetica, sans-serif; fill: #111827; }
      .kernel-label { font: 700 24px Inter, Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 20px Inter, Arial, Helvetica, sans-serif; fill: #374151; }
      .footer { font: italic 20px Inter, Arial, Helvetica, sans-serif; fill: #374151; }
      .layer { stroke: #1f2937; stroke-width: 2.5; rx: 18; ry: 18; }
      .box { stroke: #374151; stroke-width: 2; rx: 10; ry: 10; }
      .kernel-box { stroke: #17456f; stroke-width: 2.2; rx: 10; ry: 10; }
      .arrow { stroke: #111827; stroke-width: 3.2; marker-end: url(#arrowhead); }
      .icon { stroke: #155e91; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #155e91; }
    </style>

    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#111827"/>
    </marker>

    <linearGradient id="gDrivers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#dfefff"/>
    </linearGradient>
    <linearGradient id="gIdentity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f8ef"/>
      <stop offset="1" stop-color="#e4f1e1"/>
    </linearGradient>
    <linearGradient id="gFabrics" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="1" stop-color="#f7e9bd"/>
    </linearGradient>
    <linearGradient id="gQueues" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0ff"/>
      <stop offset="1" stop-color="#ebe3fb"/>
    </linearGradient>
    <linearGradient id="gKernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#d8ecfb"/>
    </linearGradient>
    <linearGradient id="gOutcomes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff8ee"/>
      <stop offset="1" stop-color="#e3f1df"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2200" fill="#fbfbfa"/>

  <text x="800" y="74" text-anchor="middle" class="title">ClimateSOS Execution / Flow Architecture Diagram</text>
  <text x="800" y="116" text-anchor="middle" class="subtitle">Dynamic execution view showing synchronization flow, pressure accumulation, and outcome binding.</text>

  <!-- 1. External System Drivers -->
  <rect x="70" y="170" width="1460" height="198" fill="url(#gDrivers)" class="layer"/>
  <text x="800" y="226" text-anchor="middle" class="layer-title">1. External System Drivers</text>

  <rect x="115" y="265" width="280" height="72" fill="#e8f3ff" class="box"/>
  <text x="255" y="310" text-anchor="middle" class="label">Capital / Finance</text>

  <rect x="455" y="265" width="300" height="72" fill="#e8f3ff" class="box"/>
  <text x="605" y="310" text-anchor="middle" class="label">Policy + Governance</text>

  <rect x="815" y="265" width="300" height="72" fill="#e8f3ff" class="box"/>
  <text x="965" y="310" text-anchor="middle" class="label">Biosphere Conditions</text>

  <rect x="1175" y="265" width="280" height="72" fill="#e8f3ff" class="box"/>
  <text x="1315" y="310" text-anchor="middle" class="label">Fossil System State</text>

  <line x1="800" y1="368" x2="800" y2="443" class="arrow"/>

  <!-- 2. Identity Tokens -->
  <rect x="70" y="443" width="1460" height="146" fill="url(#gIdentity)" class="layer"/>
  <text x="800" y="501" text-anchor="middle" class="layer-title">2. Identity Tokens</text>
  <text x="800" y="548" text-anchor="middle" class="small">TTL • Binding • History • Synchronization State</text>

  <line x1="800" y1="589" x2="800" y2="664" class="arrow"/>

  <!-- 3. Synchronization Fabrics -->
  <rect x="70" y="664" width="1460" height="198" fill="url(#gFabrics)" class="layer"/>
  <text x="800" y="720" text-anchor="middle" class="layer-title">3. Synchronization Fabrics</text>

  <rect x="115" y="759" width="300" height="72" fill="#fff4cf" class="box"/>
  <text x="265" y="804" text-anchor="middle" class="label">Deliverability Fabric</text>

  <rect x="455" y="759" width="300" height="72" fill="#fff4cf" class="box"/>
  <text x="605" y="804" text-anchor="middle" class="label">Procurement Fabric</text>

  <rect x="815" y="759" width="300" height="72" fill="#fff4cf" class="box"/>
  <text x="965" y="804" text-anchor="middle" class="label">Institutional Fabric</text>

  <rect x="1175" y="759" width="300" height="72" fill="#fff4cf" class="box"/>
  <text x="1325" y="804" text-anchor="middle" class="label">Fossil Constraint Fabric</text>

  <line x1="800" y1="862" x2="800" y2="937" class="arrow"/>

  <!-- 4. Queues / Pressure Accumulation -->
  <rect x="70" y="937" width="1460" height="198" fill="url(#gQueues)" class="layer"/>
  <text x="800" y="993" text-anchor="middle" class="layer-title">4. Queues / Pressure Accumulation</text>

  <rect x="115" y="1032" width="280" height="72" fill="#f3efff" class="box"/>
  <text x="255" y="1077" text-anchor="middle" class="label">Delivery Queue</text>

  <rect x="455" y="1032" width="300" height="72" fill="#f3efff" class="box"/>
  <text x="605" y="1077" text-anchor="middle" class="label">Adequacy Queue</text>

  <rect x="815" y="1032" width="300" height="72" fill="#f3efff" class="box"/>
  <text x="965" y="1077" text-anchor="middle" class="label">Materials Queue</text>

  <rect x="1175" y="1032" width="280" height="72" fill="#f3efff" class="box"/>
  <text x="1315" y="1077" text-anchor="middle" class="label">Permitting Queue</text>

  <line x1="800" y1="1135" x2="800" y2="1210" class="arrow"/>

  <!-- 5. ClimateSOS Kernel -->
  <rect x="70" y="1210" width="1460" height="428" fill="url(#gKernel)" stroke="#17456f" stroke-width="3.2" rx="20" ry="20"/>
  <text x="800" y="1270" text-anchor="middle" class="layer-title">5. ClimateSOS Kernel</text>

  <rect x="115" y="1320" width="420" height="124" fill="#e4f3ff" class="kernel-box"/>
  <!-- clock icon, vertically centered as large bullet -->
  <circle cx="178" cy="1382" r="38" class="icon"/>
  <line x1="178" y1="1382" x2="178" y2="1350" class="icon"/>
  <line x1="178" y1="1382" x2="203" y2="1404" class="icon"/>
  <line x1="152" y1="1382" x2="142" y2="1382" class="icon"/>
  <line x1="204" y1="1382" x2="214" y2="1382" class="icon"/>
  <text x="245" y="1372" class="kernel-label">Synchronization</text>
  <text x="245" y="1404" class="kernel-label">Scheduler</text>

  <rect x="590" y="1320" width="420" height="124" fill="#e4f3ff" class="kernel-box"/>
  <!-- gauge icon -->
  <path d="M657 1408 A48 48 0 0 1 753 1408" class="icon"/>
  <line x1="705" y1="1408" x2="734" y2="1372" class="icon"/>
  <circle cx="705" cy="1408" r="8" class="icon-fill"/>
  <line x1="668" y1="1392" x2="657" y2="1388" class="icon"/>
  <line x1="687" y1="1368" x2="682" y2="1357" class="icon"/>
  <line x1="723" y1="1368" x2="728" y2="1357" class="icon"/>
  <line x1="742" y1="1392" x2="753" y2="1388" class="icon"/>
  <text x="780" y="1372" class="kernel-label">Pressure</text>
  <text x="780" y="1404" class="kernel-label">Accumulation</text>

  <rect x="1065" y="1320" width="420" height="124" fill="#e4f3ff" class="kernel-box"/>
  <!-- attractor / network icon -->
  <circle cx="1135" cy="1382" r="26" class="icon"/>
  <circle cx="1135" cy="1382" r="8" class="icon"/>
  <circle cx="1135" cy="1339" r="10" class="icon"/>
  <circle cx="1178" cy="1382" r="10" class="icon"/>
  <circle cx="1135" cy="1425" r="10" class="icon"/>
  <circle cx="1092" cy="1382" r="10" class="icon"/>
  <line x1="1135" y1="1356" x2="1135" y2="1349" class="icon"/>
  <line x1="1161" y1="1382" x2="1168" y2="1382" class="icon"/>
  <line x1="1135" y1="1408" x2="1135" y2="1415" class="icon"/>
  <line x1="1109" y1="1382" x2="1102" y2="1382" class="icon"/>
  <text x="1215" y="1372" class="kernel-label">Weighted</text>
  <text x="1215" y="1404" class="kernel-label">Attractors</text>

  <rect x="115" y="1498" width="1370" height="94" fill="#e4f3ff" class="kernel-box"/>
  <text x="800" y="1554" text-anchor="middle" class="kernel-label">Delivery / Alignment Switch</text>

  <line x1="800" y1="1638" x2="800" y2="1713" class="arrow"/>

  <!-- 6. System Outcomes -->
  <rect x="70" y="1713" width="1460" height="198" fill="url(#gOutcomes)" class="layer"/>
  <text x="800" y="1769" text-anchor="middle" class="layer-title">6. System Outcomes</text>

  <rect x="145" y="1808" width="285" height="72" fill="#edf7eb" class="box"/>
  <text x="287.5" y="1853" text-anchor="middle" class="label">CleanBound</text>

  <rect x="487" y="1808" width="285" height="72" fill="#edf7eb" class="box"/>
  <text x="629.5" y="1853" text-anchor="middle" class="label">MixedBound</text>

  <rect x="829" y="1808" width="285" height="72" fill="#edf7eb" class="box"/>
  <text x="971.5" y="1853" text-anchor="middle" class="label">FossilBound</text>

  <rect x="1171" y="1808" width="285" height="72" fill="#edf7eb" class="box"/>
  <text x="1313.5" y="1853" text-anchor="middle" class="label">NoAck / Timeout</text>

  <text x="800" y="2022" text-anchor="middle" class="footer">Conceptual systems architecture diagram • Illustrative ontology / prototype model •</text>
  <text x="800" y="2054" text-anchor="middle" class="footer">Not a calibrated operational deployment model.</text>
</svg>
